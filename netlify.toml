[build]
  publish = "."

[[headers]]
  for = "/assets/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
